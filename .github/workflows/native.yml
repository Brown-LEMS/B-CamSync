name: Linux native validation

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    name: Debian 12 ARM64 software checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      BCAMSYNC_TOOLCHAIN: gcc
      BCAMSYNC_PLATFORM: linux/arm64
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build shared Debian development image
        run: |
          bash tools/container.sh image 2>&1 | tee "$RUNNER_TEMP/bcamsync-image.log"
      - name: Check core, managed fake capture, and Python interfaces
        run: |
          bash tools/container.sh software 2>&1 | tee "$RUNNER_TEMP/bcamsync-software.log"
      - name: Check CI wheel installer
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            bcamsync-dev:bookworm \
            /opt/bcamsync/venv/bin/python -m unittest discover -s tools -p test_install_ci_wheel.py -v
      - name: Preserve software validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-arm64
          path: |
            build-linux/logs/**
            build-linux/**/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/bcamsync-*.log
