[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "bcamsync"
version = "0.1.0"
description = "Synchronized board-level camera acquisition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
preview = ["Pillow>=11"]

[project.scripts]
bcamsync-manage = "bcamsync.management:main"

[tool.scikit-build]
wheel.packages = ["python/bcamsync"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
BCAMSYNC_BUILD_TESTS = "OFF"
BCAMSYNC_BUILD_PYTHON = "ON"
